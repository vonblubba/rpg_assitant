{% extends "base.html" %}
{% block content %}
<h1>Game Systems</h1>
<form id="create-system-form">
    <input type="text" name="name" placeholder="e.g. D&amp;D 5e" required>
    <button type="submit">Create</button>
</form>
<ul id="systems-list" class="card-list">
    {% for system in systems %}
    <li class="card">
        <div class="card-main">
            <a href="/systems/{{ system.id }}" class="card-title">{{ system.name }}</a>
            <a href="/systems/{{ system.id }}/chat">Chat</a>
        </div>
        <button class="delete-system btn-muted" data-system-id="{{ system.id }}">Delete</button>
    </li>
    {% endfor %}
</ul>
{% endblock %}
